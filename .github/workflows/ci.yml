name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run checks
        run: make check

  web:
    # Builds the browser bundle visitors actually play and boots it in headless
    # Chromium. The April 2026 itch.io build could no longer be rebuilt: the
    # same pygbag pin now fetches a newer runtime that crashed at import.
    runs-on: ubuntu-latest
    needs: checks
    env:
      PYGBAG_VERSION: "0.9.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pygbag==${PYGBAG_VERSION}" playwright
          python -m playwright install --with-deps chromium-headless-shell

      - name: Build web bundle
        run: PYTHON=python tools/build_web.sh

      - name: Boot it in a browser
        run: python tools/web_smoke.py

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: |
            build/web.zip
            build/web-smoke-*.png
          if-no-files-found: ignore

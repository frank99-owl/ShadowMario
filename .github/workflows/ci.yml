name: CI

on:
  push:
  pull_request:
  # Weekly, so main is re-checked even when nobody pushes. An unpinned linter
  # left main failing from August to October 2026 with nothing to show it, and
  # the browser runtime is fetched from pygame-web's CDN at play time, so it
  # can change without any change here.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run checks
        run: make check

  web:
    # Builds the browser bundle visitors play and boots it in headless Chromium.
    # Until October 2026 nothing did: the live itch.io build was a hand-made
    # pygbag 0.9.2 bundle, and building with the pinned 0.9.3 crashed at import.
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt
          python -m playwright install --with-deps chromium-headless-shell

      - name: Build web bundle
        run: PYTHON=python tools/build_web.sh

      - name: Boot it in a browser
        run: python tools/web_smoke.py

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: |
            build/web.zip
            build/web-smoke-*.png
          if-no-files-found: ignore

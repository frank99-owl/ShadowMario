name: Deploy web build to itch.io

# Manual only: publishing changes what every visitor plays, so a person
# starts it. It rebuilds from the chosen ref and refuses to push a bundle that
# does not boot.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "itch.io channel of the playable HTML upload (check the game's Uploads page)"
        required: true
        default: "web"

concurrency:
  group: deploy-itch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ITCH_GAME: ${{ vars.ITCH_GAME || 'frank-owl/shadowmario' }}
      PYGBAG_VERSION: "0.9.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pygbag==${PYGBAG_VERSION}" playwright
          python -m playwright install --with-deps chromium-headless-shell

      - name: Build web bundle
        run: PYTHON=python tools/build_web.sh

      - name: Boot it in a browser
        run: python tools/web_smoke.py

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ inputs.channel }}
        run: butler push build/web.zip "${ITCH_GAME}:${CHANNEL}" --userversion "${GITHUB_SHA::7}"

name: Deploy web build to itch.io

# Manual only: publishing changes what every visitor plays, so a person
# starts it. It rebuilds from the chosen ref and refuses to push a bundle that
# does not boot.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "itch.io channel of the playable HTML upload (check the game's Uploads page)"
        required: true
        default: "web"
      status_only:
        description: "Only list the game's existing channels (butler status); build and push nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-itch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ITCH_GAME: ${{ vars.ITCH_GAME || 'frank-owl/shadowmario' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup butler
        # Third-party action in a job that holds BUTLER_API_KEY: pinned to a
        # commit, not a tag that can be moved. Dependabot updates the pin.
        uses: remarkablegames/setup-butler@64c286ef04cbc1e3ef65914939d34187ae29c422 # v3.0.4
        with:
          # butler itself, pinned too (the action defaults to LATEST). Dependabot
          # does not track action inputs, so bump this by hand; every version stays
          # downloadable: https://broth.itch.zone/butler/linux-amd64/versions
          butler-version: "15.32.0"

      - name: List itch.io channels
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        # Pushing to a channel name that does not exist creates a new upload
        # instead of replacing the one the page plays, so check first.
        run: butler status "${ITCH_GAME}"

      - name: Install build dependencies
        if: ${{ !inputs.status_only }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt
          python -m playwright install --with-deps chromium-headless-shell

      - name: Build web bundle
        if: ${{ !inputs.status_only }}
        run: PYTHON=python tools/build_web.sh

      - name: Boot it in a browser
        if: ${{ !inputs.status_only }}
        run: python tools/web_smoke.py

      - name: Push to itch.io
        if: ${{ !inputs.status_only }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: ${{ inputs.channel }}
        run: butler push build/web.zip "${ITCH_GAME}:${CHANNEL}" --userversion "${GITHUB_SHA::7}"
